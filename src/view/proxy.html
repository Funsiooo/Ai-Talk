<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>代理设置</title>
  <link rel="stylesheet" href="../css/proxy.css">
</head>
<body>
  <div class="container">
    <h1>
      <img src="../../assets/network.svg" alt="设置" class="icon"> 设置代理
    </h1>

    <input type="text" id="proxy-input" placeholder="请输入代理地址,例：http://127.0.0.1:7890">
    <div id="proxy-notify" class="proxy-notify" style="display:none;"></div>
    <div class="button-group">
      <button id="set-proxy-btn">设置代理</button>
      <button id="clear-proxy-btn">清除代理</button>
      <button id="cancel">关闭</button>
    </div>
  </div>

  <script>
    const proxyInput = document.getElementById('proxy-input');
    const setProxyBtn = document.getElementById('set-proxy-btn');
    const clearProxyBtn = document.getElementById('clear-proxy-btn');
    const cancelButton = document.getElementById('cancel');

    // 设置代理（错误信息用应用内提示展示，替代原生框架弹窗）
    setProxyBtn.addEventListener('click', () => {
      const proxyAddress = proxyInput.value.trim();
      if (!proxyAddress) {
        showProxyNotify('请输入代理地址');
        return;
      }
      window.electron.setProxy(proxyAddress).then(function (res) {
        if (res && res.ok) {
          showProxyNotify('代理设置成功', true);
        } else if (res) {
          showProxyNotify(res.error || '设置代理失败');
        }
      });
    });

    // 应用内提示（黑色样式，替代原生 dialog）
    var proxyNotifyTimer = null;
    function showProxyNotify(message, isSuccess) {
      var el = document.getElementById('proxy-notify');
      if (!el) return;
      el.textContent = message;
      el.className = 'proxy-notify ' + (isSuccess ? 'proxy-notify-success' : 'proxy-notify-error');
      el.style.display = 'block';
      if (proxyNotifyTimer) clearTimeout(proxyNotifyTimer);
      proxyNotifyTimer = setTimeout(function () {
        el.style.display = 'none';
      }, 4000);
    }

    // 清除代理
    clearProxyBtn.addEventListener('click', () => {
      window.electron.clearProxy();
    });

    // 关闭窗口
    cancelButton.addEventListener('click', () => {
      window.close();
    });
  </script>
</body>
</html>
